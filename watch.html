<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Watch Live — January 18 Countdown</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./">JAN 18 <b>/</b> 2028</a>
    <nav><a href="./">Countdown</a><a href="setup.html">Setup</a></nav>
  </header>

  <main class="watch-wrap">
    <div class="eyebrow"><span class="pulse"></span> LIVE BROADCAST</div>
    <h1>WATCH THE COUNTDOWN</h1>
    <p class="subtitle">The livestream will appear here when it is live.</p>
    <div class="player-shell">
      <div id="playerPlaceholder">Add your YouTube Live video link in <a href="setup.html">Setup</a> to show the stream here.</div>
      <iframe id="ytPlayer" title="YouTube livestream"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen hidden></iframe>
    </div>
    <a class="backlink" href="./">← Back to countdown</a>
  </main>

  <div class="native-audio">
    <audio id="backgroundMusic" src="background-music.mp3" controls loop preload="metadata">
      Your browser does not support audio playback.
    </audio>
  </div>

  <script src="app.js"></script>
</body>
</html>
