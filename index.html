<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>January 18, 2028 — Countdown</title><link rel="stylesheet" href="style.css">
</head>
<body class="broadcast">
<div class="stars"></div><main class="hero">
  <div class="eyebrow"><span class="pulse"></span> THE COUNTDOWN IS ON</div>
  <h1 id="eventTitle">JANUARY 18, 2028</h1>
  <p class="subtitle">A moment worth counting down to.</p>
  <section class="timer" aria-label="Countdown">
    <div class="unit"><strong id="days">000</strong><span>DAYS</span></div>
    <div class="colon">:</div><div class="unit"><strong id="hours">00</strong><span>HOURS</span></div>
    <div class="colon">:</div><div class="unit"><strong id="minutes">00</strong><span>MINUTES</span></div>
    <div class="colon">:</div><div class="unit"><strong id="seconds">00</strong><span>SECONDS</span></div>
  </section>
  <div class="date-line">18 JANUARY 2028 <i>•</i> 00:00 LATVIA TIME</div>
  <div class="footerline"><span>COUNTING EVERY SECOND</span><span>EUROPE / RIGA</span></div>
</main>
<script src="app.js"></script>
</body></html>
